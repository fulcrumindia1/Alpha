services:
  fulcrum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fulcrum-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - DATA_BACKEND=supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
    networks:
      - fulcrum-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1800M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: fulcrum-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-app.fulcrumindia.online}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fulcrum-net
    depends_on:
      fulcrum:
        condition: service_healthy

networks:
  fulcrum-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
